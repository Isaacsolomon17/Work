name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/beautiful-lamport-s8h3vm
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/beautiful-lamport-s8h3vm

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: commercial-realty

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
